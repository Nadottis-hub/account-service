[project]
name = "account-service"
version = "0.1.0"
description = "Mirrors Clerk users into Postgres and serves profile data to internal services."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "svix>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated by Alembic; left as emitted so future autogenerate diffs stay clean.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Depends()/Query() in argument defaults is the documented FastAPI idiom.
ignore = ["B008"]


[tool.setuptools.packages.find]
include = ["app*"]
